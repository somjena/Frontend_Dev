<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rowspan Example</title>
</head>
<body>

<table border="1" cellpadding="10" cellspacing="10">
    <tr>
        <th rowspan="2">Data</th>
        <th>Age</th>
        <th>Contact</th>
    </tr>
    <tr>
        
        <td>25</td>
        <td>6371326214</td>
    </tr>
</table>

</body>
</html>
